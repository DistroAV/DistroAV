name: Update WinGet Package
run-name: Publish ${{ inputs.versionTargeted || github.event.release.tag_name }} to WinGet

on:
  release:
    types: [released] # Fires when a non-prerelease is published (draft -> published); skips prereleases.
  workflow_dispatch:
    inputs:
      versionTargeted:
        description: "Existing release tag to submit to WinGet (e.g. 6.2.2)"
        required: true
        type: string
      dryRun:
        description: "Dry run: run validation only, do not submit to winget-pkgs"
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: publish-winget
  cancel-in-progress: false

env:
  PACKAGE_ID: DistroAV.DistroAV
  RELEASE_TAG: ${{ inputs.versionTargeted || github.event.release.tag_name }}
  INSTALLER_SUFFIX: -windows-x64-Installer.exe

jobs:
  validate-winget-package:
    name: Validate WinGet Package
    if: github.repository == 'DistroAV/DistroAV' # Forks must not submit to winget-pkgs.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check release and installer asset
        id: asset
        run: |
          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw "Release $env:RELEASE_TAG is a draft or prerelease." }
          $assets = @($release.assets | Where-Object { $_.name.EndsWith($env:INSTALLER_SUFFIX) })
          if ($assets.Count -ne 1) { throw "Expected exactly 1 installer asset, found $($assets.Count)." }
          $asset = $assets[0]
          $version = $env:RELEASE_TAG
          if ($asset.name -notlike "*-$version-*") { throw "Asset '$($asset.name)' does not match version $version." }
          "name=$($asset.name)" >> $env:GITHUB_OUTPUT
          "url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT
          "digest=$($asset.digest -replace '^sha256:','')" >> $env:GITHUB_OUTPUT

      - name: Download installer and verify hash
        run: |
          Invoke-WebRequest -Uri '${{ steps.asset.outputs.url }}' -OutFile installer.exe
          $actual = (Get-FileHash installer.exe -Algorithm SHA256).Hash.ToLower()
          $expected = '${{ steps.asset.outputs.digest }}'.ToLower()
          if (-not $expected) { throw 'GitHub did not provide a digest for the asset.' }
          if ($actual -ne $expected) { throw "SHA256 mismatch: expected $expected, got $actual" }
          Write-Host "SHA256 OK: $actual"

      - name: Defender malware scan
        run: |
          Update-MpSignature
          Start-MpScan -ScanType CustomScan -ScanPath "$PWD\installer.exe"
          $threats = @(Get-MpThreatDetection | Where-Object { $_.Resources -like '*installer.exe*' })
          if ($threats.Count -gt 0) { throw "Defender flagged the installer: $($threats | Out-String)" }

      - name: Generate and validate manifests
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update $env:PACKAGE_ID --version $env:RELEASE_TAG --urls '${{ steps.asset.outputs.url }}' --out manifests --token $env:GH_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'wingetcreate failed.' }
          $manifestDir = (Get-ChildItem manifests -Recurse -Filter '*.installer.yaml' | Select-Object -First 1).DirectoryName
          winget validate --manifest $manifestDir
          if ($LASTEXITCODE -ne 0) { throw 'winget validate failed.' }

      - name: Silent install test
        run: |
          $p = Start-Process .\installer.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$PWD\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install exited with $($p.ExitCode)" }
          $keys = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $entry = Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'DistroAV*' } | Select-Object -First 1
          if (-not $entry) { throw 'No DistroAV uninstall entry found after install.' }
          if ($entry.DisplayVersion -ne $env:RELEASE_TAG) { throw "Installed version '$($entry.DisplayVersion)' != $env:RELEASE_TAG" }
          Write-Host "Installed: $($entry.DisplayName) $($entry.DisplayVersion)"
          "UNINSTALL=$($entry.UninstallString -replace '"','')" >> $env:GITHUB_ENV

      - name: Silent uninstall test
        run: |
          $p = Start-Process $env:UNINSTALL -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent uninstall exited with $($p.ExitCode)" }
          $keys = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          if (Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'DistroAV*' }) { throw 'Uninstall entry still present.' }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winget-validation-logs
          path: |
            install.log
            manifests/
          if-no-files-found: ignore

  publish-winget-package:
    name: Publish WinGet Package
    needs: validate-winget-package
    if: github.repository == 'DistroAV/DistroAV' && !(github.event_name == 'workflow_dispatch' && inputs.dryRun) # Forks must not submit to winget-pkgs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Opens a PR on microsoft/winget-pkgs from the token owner's fork of winget-pkgs.
      # Requires a fork of microsoft/winget-pkgs and the WINGET_UPDATER_TOKEN secret (classic PAT, public_repo scope).
      - name: Submit WinGet manifest PR
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: DistroAV.DistroAV
          installers-regex: '-windows-x64-Installer\.exe$' # Only the Inno Setup installer; excludes zip/portable.
          release-tag: ${{ env.RELEASE_TAG }}
          release-notes-url: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
          token: ${{ secrets.WINGET_UPDATER_TOKEN }}
