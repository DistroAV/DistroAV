name: Security Scan
# zizmor audits the GitHub Actions workflows and composite actions (pinning,
# permissions, secrets, injection). Complements CodeQL default setup (C/C++ and
# Actions). The weekly run picks up new audits without a code change.
on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches:
      - master
    paths:
      - '.github/**'
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zizmor:
    name: zizmor 🌈
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install zizmor
        run: pip install -r .github/requirements-security.txt
      - name: Run zizmor
        run: zizmor --offline --min-severity medium --min-confidence medium --config .github/zizmor.yml .github
